name: Update Shiny Wars dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-dashboard.yml"
      - "config/**"
      - "data/**"
      - "src/**"
      - "tests/**"
      - "web/**"
      - "requirements.txt"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deployment that has already started.
# A later workflow run may wait for the current run instead of invalidating it.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend tests
        run: |
          node tests/test_live_time.js
          node tests/test_app_best_spots.js
          node --check web/app.js

      - name: Read Google Sheet and rebuild rankings
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -m src.build_dashboard --google-sheet --output web/data/strategy.json

      - name: Validate generated site data
        run: python scripts/validate_site_data.py web/data/strategy.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
