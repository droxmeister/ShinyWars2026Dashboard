name: Update Shiny Wars dashboard

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, deliberately away from the top of the hour.
    - cron: "7,17,28,37,47,57 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-dashboard.yml"
      - "config/**"
      - "data/**"
      - "src/**"
      - "web/**"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read Google Sheet and rebuild rankings
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -m src.build_dashboard --google-sheet --output web/data/strategy.json

      - name: Validate generated site data
        run: python scripts/validate_site_data.py web/data/strategy.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
